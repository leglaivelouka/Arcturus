<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0718">
  <title>Arcturus : le ciel de ce soir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-rouge">
  <main class="ecran">

    <a class="titre" href="ciel.html">le ciel de ce soir <span aria-hidden="true">🔭</span></a>

    <button id="btn-position" class="hexagone" type="button">ma position</button>

    <section class="ligne">
      <p id="heure" class="heure" aria-label="Heure actuelle">00:00</p>

      <article class="carte meteo">
        <h2>météo <span aria-hidden="true">🌙</span></h2>
        <div id="meteo-valeurs" class="mesures" aria-live="polite"></div>
      </article>
    </section>

    <article class="carte actus">
      <h2>actualités :</h2>
      <ul id="liste-evenements" class="evenements"></ul>
    </article>

    <a class="pastille" href="profil.html">profil</a>

    <nav class="barre" aria-label="Navigation principale">
      <a href="catalogue.html"><span class="icone" aria-hidden="true">📄</span>catalogue</a>
      <a href="settings.html"><span class="icone" aria-hidden="true">⚙️</span>settings</a>
      <a href="forum.html"><span class="icone" aria-hidden="true">🪐</span>forum</a>
    </nav>

  </main>

  <dialog id="dialogue-position" aria-labelledby="titre-position">
    <h2 id="titre-position">Choisir une position</h2>
    <button id="btn-gps" class="bouton" type="button">Utiliser ma position GPS</button>
    <p class="ou">ou</p>
    <div class="recherche">
      <input id="champ-ville" type="search" placeholder="Nom d'une ville" autocomplete="off" aria-label="Nom d'une ville">
      <button id="btn-chercher" class="bouton" type="button">Chercher</button>
    </div>
    <p id="message-position" class="message" role="status"></p>
    <ul id="resultats-villes" class="resultats"></ul>
    <button id="btn-fermer" class="bouton discret" type="button">Fermer</button>
  </dialog>

  <script src="js/accueil.js"></script>
</body>
</html>
