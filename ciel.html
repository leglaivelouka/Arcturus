<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="preload" as="image" href="assets/chargement.webp">
  <link rel="stylesheet" href="css/splash.css">
  <script src="js/splash.js"></script>
  <noscript><style>#splash { display: none; }</style></noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040815">
  <title>Arcturus : carte du ciel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ciel.css">
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement en cours">
    <div class="splash-cadre">
      <img class="splash-image" src="assets/chargement.webp" alt="">
      <div class="splash-anneau"></div>
    </div>
  </div>

  <canvas id="ciel" role="img" aria-label="Carte du ciel interactive"></canvas>
  <canvas id="voielactee" aria-hidden="true"></canvas>
  <canvas id="paysage" aria-hidden="true"></canvas>

  <p id="message-ciel" class="message-ciel" role="status" hidden></p>

  <div id="horloge" class="horloge">
    <p id="ciel-heure">00:00</p>
    <p id="ciel-date">00/00/0000</p>
  </div>

  <button id="btn-menu" class="menu" type="button" aria-label="Réglages d'affichage" aria-expanded="false" aria-controls="panneau">
    <span></span><span></span><span></span>
  </button>

  <div id="panneau" class="panneau" hidden>
    <div class="bas-panneau">
      <div class="temps">
        <div class="ligne-temps">
          <output id="reg-heure">00:00</output>
          <span class="fleches">
            <button type="button" id="h-moins" aria-label="Reculer de 10 minutes">&lt;</button>
            <button type="button" id="h-reset" aria-label="Revenir à l'heure actuelle">↺</button>
            <button type="button" id="h-plus" aria-label="Avancer de 10 minutes">&gt;</button>
          </span>
        </div>
        <div class="ligne-temps">
          <output id="reg-date">00/00/0000</output>
          <span class="fleches">
            <button type="button" id="d-moins" aria-label="Reculer d'un jour">&lt;</button>
            <button type="button" id="d-reset" aria-label="Revenir à la date actuelle">↺</button>
            <button type="button" id="d-plus" aria-label="Avancer d'un jour">&gt;</button>
          </span>
        </div>
      </div>
      <button type="button" id="btn-reglages" class="engrenage" aria-label="Réglages de la carte"><span aria-hidden="true">⚙️</span></button>
    </div>

    <div class="barre-heure">
      <label class="cache" for="curseur-heure">Heure de la journée</label>
      <input id="curseur-heure" type="range" min="0" max="1439" step="1" value="0">
      <div class="graduations" aria-hidden="true"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>
    </div>

    <div class="barre-heure barre-vitesse">
      <div class="entete-vitesse">
        <label for="curseur-vitesse">Vitesse du temps</label>
        <output id="vitesse-valeur">×1 (temps réel)</output>
      </div>
      <input id="curseur-vitesse" type="range" min="-100" max="100" step="1" value="0">
      <div class="graduations" aria-hidden="true"><span>passé</span><span>temps réel</span><span>futur</span></div>
    </div>
  </div>

  <aside id="fiche" class="fiche" role="dialog" aria-labelledby="fiche-titre" hidden>
    <div class="fiche-tete">
      <div>
        <h2 id="fiche-titre"></h2>
        <p id="fiche-sous" class="fiche-sous"></p>
      </div>
      <button type="button" id="fiche-fermer" class="fiche-x" aria-label="Fermer la fiche">✕</button>
    </div>
    <dl id="fiche-lignes" class="fiche-lignes"></dl>
    <p id="fiche-note" class="fiche-note" hidden></p>
    <div class="fiche-actions">
      <button type="button" id="fiche-centrer" class="bouton">Centrer sur l'objet</button>
      <a id="fiche-savoir" class="bouton lien" target="_blank" rel="noopener noreferrer" hidden>En savoir plus</a>
    </div>
  </aside>

  <dialog id="dialogue-carte" aria-label="Réglages de la carte">
    <div class="reglages-tete">
      <h2 class="pastille-section">Affichage :</h2>
      <button id="btn-fermer-carte" class="bouton-croix" type="button" aria-label="Fermer les réglages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 3.5 20.5 20.5M20.5 3.5 3.5 20.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>

    <div class="groupe" role="group" aria-label="Affichage">
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="paysage"></span><span class="etiquette"><span>Paysage</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="constellations"></span><span class="etiquette"><span>Constellations</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="atmosphere"></span><span class="etiquette"><span>Atmosphère</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="noms"></span><span class="etiquette"><span>Noms des astres</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="lignes"></span><span class="etiquette"><span>Grille azimutale (azimut et hauteur)</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="grilleEquatoriale"></span><span class="etiquette"><span>Grille équatoriale (AD et déclinaison)</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="ecliptique"></span><span class="etiquette"><span>Écliptique (trajet du Soleil)</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="nuit"></span><span class="etiquette"><span>Mode nuit (écran rouge)</span></span></label>
    </div>

    <div class="groupe" role="group" aria-labelledby="titre-profond">
      <h3 id="titre-profond" class="pastille-section">Objets du ciel profond :</h3>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="voieLactee"></span><span class="etiquette"><span>Voie lactée</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="galaxies"></span><span class="etiquette"><span>Galaxies</span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="nebuleuses"></span><span class="etiquette"><span>Nébuleuses <small>(dont planétaires et rémanents)</small></span></span></label>
      <label class="ligne-reglage"><span class="onglet"><input type="checkbox" data-reglage="amas"></span><span class="etiquette"><span>Amas <small>(ouverts et globulaires)</small></span></span></label>
    </div>

    <div class="groupe" role="group" aria-labelledby="titre-etoiles">
      <h3 id="titre-etoiles" class="pastille-section">Étoiles :</h3>
      <div class="boite-curseur">
        <label for="mag-limite">Visibles jusqu'à la magnitude <output id="mag-valeur">6,5</output></label>
        <input id="mag-limite" type="range" min="3" max="6.5" step="0.1" value="6.5">
      </div>
    </div>

    <a class="lien-accueil" href="index.html">retour à l'accueil</a>
  </dialog>

  <div id="voile" class="voile" hidden></div>

  <script src="js/astronomy.browser.min.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/paysage.js"></script>
  <script src="js/ciel.js"></script>
</body>
</html>
