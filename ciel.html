<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040815">
  <title>Arcturus : carte du ciel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ciel.css">
</head>
<body>
  <canvas id="ciel" role="img" aria-label="Carte du ciel interactive"></canvas>

  <p id="message-ciel" class="message-ciel" role="status" hidden></p>

  <div class="horloge">
    <p id="ciel-heure">00:00</p>
    <p id="ciel-date">00/00/0000</p>
  </div>

  <button id="btn-menu" class="menu" type="button" aria-label="Menu de la carte" aria-expanded="false" aria-controls="panneau">
    <span></span><span></span><span></span>
  </button>

  <div id="panneau" class="panneau" hidden>
    <a href="index.html">retour à l'accueil</a>
  </div>

  <script src="js/astro.js"></script>
  <script src="js/ciel.js"></script>
</body>
</html>
